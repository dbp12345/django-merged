{% extends "admin/change_list.html" %}
{% load static %}

{% block content %}
    {{ block.super }}
    <script type="text/javascript" src="{% static 'employees_table/js/Sortable.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'employees_table/js/filter-advanced-settings.js' %}"></script>
    <!-- 🔹 Modal Window for Additional Settings -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h5>Columns..</h5>
            <div class="modal-body">
                <div>
                    <button class="modal-content-button" id="select-all">Select All</button>
                    <button class="modal-content-button" id="deselect-all">Deselect All</button>
                    <button class="modal-content-button" id="sort-alpha">Sort A-Z</button>
                </div>
                <ul id="contacts-list"></ul>
            </div>
        </div>
    </div>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        /*For User Settings*/
        #open-settings {
            padding: 5px;
            position: absolute;
            top: 0;
            right: 30px;
            cursor: pointer;
            z-index: 10;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            /*text-align: center;*/
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 8px;
            right: 15px;
            font-size: 34px;
            cursor: pointer;
            line-height: 24px;
            color: gray;
        }

        .close-modal:hover {
            color: black;
        }

        .sort-icon {
            position: absolute;
            top: 32px;
            right: 40px;
            font-size: 12px;
            color: lightgrey;
            cursor: pointer;
            line-height: 10px;
        }

        .sort-icon:hover {
            color: gray;
        }

        #contacts-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .contact-item {
            padding: 8px;
            border: 1px solid #ccc;
            margin-bottom: 5px;
            background: #f9f9f9;
            cursor: move;
            transition: background 0.2s;
        }

        .contact-item input[type="checkbox"] {
            height: 15px;
            width: 15px;
            margin-right: 10px;
            vertical-align: text-bottom;
        }

        .contact-item:hover {
            background: #e3e3e3;
        }

        .modal.open {
            display: flex;
            opacity: 1;
        }

        .modal-content button {
            height: auto;
            width: auto;
            margin: 0 8px 0 0;
            padding: 6px 12px;
            border: 1px solid #007bff;
            background-color: white;
            color: #007bff;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .modal-content button:hover {
            background-color: #007bff;
            color: white;
        }
    </style>

{% endblock %}
