<script>
    $(document).ready(function () {
        {% comment %}
                    fetch('/admin/metrics-charts-data/')
                    .then(response => response.json())
                    .then(data => {
                        var ctx = document.getElementById('myChart').getContext('2d');
                        var myChart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: data.labels,
                                datasets: [{
                                    label: 'Сотрудники',
                                    data: data.data,
                                    backgroundColor: 'rgba(54, 162, 235, 0.5)'
                                }]
                            }
                        });
                    });
        {% endcomment %}


        const data2024 = [5, 7, 8, 6, 4, 5, 9, 10, 8, 6, 7, 5];
        const data2025 = [6, 8, 7, 5, 5, 6, 10, 13, 7, 5];
        var ctx = document.getElementById('rt130Chart').getContext('2d');
        const webinarsChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
                datasets: [
                    {
                        label: "Webinars 2024",
                        data: data2024,
                        borderColor: "rgba(75, 192, 192, 1)",
                        borderWidth: 2,
                        fill: false,
                    },
                    {
                        label: "Webinars 2025",
                        data: data2025,
                        borderColor: "rgba(255, 99, 132, 1)",
                        borderWidth: 2,
                        fill: false,
                    }
                ]
            },
            options: {
                responsive: false,  // отключает автоматическую подстройку
                plugins: {
                    title: {
                        display: true,
                        text: "Monthly RT-130 Comparison for 2024 and 2025",
                        font: {
                            size: 14
                        }
                    },
                    legend: {
                        position: "top"
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: "Number of Webinars"
                        }
                    },
                    {% comment %}
                    x: {
                        title: {
                            display: true,
                            text: "Months"
                        }
                    }
                    {% endcomment %}
                }
            }
        });

    });
</script>
