{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My PWA App</title>
  <link rel="manifest" href="{% static 'pwa/manifest.json' %}">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("{% static 'pwa/sw.js' %}");
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Hello from PWA!</h1>
  <p>This works offline if installed.</p>

  <button onclick="alert('Hello!')">Hello</button>
  <button onclick="alert('Goodbye!')">Goodbye</button>
</body>
</html>
