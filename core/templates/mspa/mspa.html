{% extends "admin/base_site.html" %}

{% load static %}

{% block extrahead %}
    {{ block.super }}
    <link href="{% static 'grappelli/css/admin_breadcrumbs.css' %}" rel="stylesheet"/>
    <script src="{% static 'grappelli/js/admin_breadcrumbs.js' %}"></script>

    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
            gap: 16px;
            align-items: start
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
            padding: 12px
        }

        .hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px
        }

        .meta {
            font-size: 13px;
            color: #444;
            display: flex;
            gap: 14px
        }

        .meta span {
            white-space: nowrap
        }

        .frame {
            width: 100%;
            height: 520px;
            border: 0;
            background: #f8f9fa
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 8px
        }

        .btn {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            margin: 0;
            width: auto;
            height: auto;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            color: #444;
        }
    </style>

{% endblock %}

{% block content %}

    <div class="grid">
        {% for c in cards %}
            <div class="card">
                <div class="hdr">
                    <a href="{{ c.admin_url }}" target="_blank" rel="noreferrer noopener">{{ c.name }}</a>
                    <div class="meta">
                        <span>{{ c.phone }}</span>
                        <span>{{ c.email }}</span>
                    </div>
                </div>

                <iframe class="frame" src="{{ c.file_url }}" type="application/pdf"></iframe>

                <div class="actions">
                    <button class="btn" onclick="this.closest('.card').querySelector('.frame').contentWindow.print()">Print</button>
                    <a class="btn" href="{{ c.file_url }}" target="_blank" rel="noreferrer noopener">Open in New Tab</a>
                </div>
            </div>
        {% empty %}
            <p>This crew has no employees with an MSPA document.</p>
        {% endfor %}
    </div>
{% endblock %}
