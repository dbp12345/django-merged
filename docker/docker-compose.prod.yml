services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    environment:
      DEBUG: "False"
      DB_ENGINE: "mysql"
      DB_NAME: "${DB_NAME}"
      DB_USER: "root"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "host.docker.internal"
      DB_PORT: "3306"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    command:
      - bash
      - -lc
      - >
        gunicorn dbfightfire.wsgi:application
        --bind 0.0.0.0:8000
        --workers 4
        --threads 2
        --timeout 120
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../staticfiles:/app/staticfiles
      - ../media:/app/media

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    environment:
      DEBUG: "False"
      DB_ENGINE: "mysql"
      DB_NAME: "${DB_NAME}"
      DB_USER: "root"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "host.docker.internal"
      DB_PORT: "3306"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    command:
      - bash
      - -lc
      - >
        celery -A dbfightfire worker
        --loglevel=INFO
        --concurrency=4

  celery-throttled:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    environment:
      DEBUG: "False"
      DB_ENGINE: "mysql"
      DB_NAME: "${DB_NAME}"
      DB_USER: "root"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "host.docker.internal"
      DB_PORT: "3306"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    command:
      - bash
      - -lc
      - >
        celery -A dbfightfire worker
        --loglevel=INFO
        --concurrency=2
        -Q throttled

  celery-one_by_one:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    environment:
      DEBUG: "False"
      DB_ENGINE: "mysql"
      DB_NAME: "${DB_NAME}"
      DB_USER: "root"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "host.docker.internal"
      DB_PORT: "3306"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    command:
      - bash
      - -lc
      - >
        celery -A dbfightfire worker
        --loglevel=INFO
        --concurrency=1
        -Q one_by_one

  mqtt_listener:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    environment:
      DEBUG: "False"
      DB_ENGINE: "mysql"
      DB_NAME: "${DB_NAME}"
      DB_USER: "root"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "host.docker.internal"
      DB_PORT: "3306"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    command:
      - bash
      - -lc
      - >
        python manage.py mqtt_listener
